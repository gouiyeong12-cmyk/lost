<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>남원여고 분실물 센터</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fb; --card: #ffffff; --text: #1f2937; --sub: #6b7280;
      --line: #e5e7eb; --main: #3b82f6; --found: #10b981; --keep: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
    header { text-align: center; padding: 16px 0 8px; }
    header h1 { margin: 0 0 6px; font-size: 26px; }
    header p { margin: 0; color: var(--sub); font-size: 14px; }

    .btn {
      display: block; text-align: center; text-decoration: none; color: #fff;
      background: var(--found); padding: 14px 10px; border-radius: 10px;
      font-weight: 700; font-size: 16px; margin: 18px 0 6px;
    }
    .hint { text-align: center; font-size: 13px; color: var(--sub); margin: 0 0 16px; }

    .tools { display: flex; gap: 8px; margin-bottom: 8px; }
    .tools input[type=search] {
      flex: 1; padding: 12px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 15px; background: #fff;
    }
    .opt { font-size: 13px; color: var(--sub); margin: 6px 2px 12px; display: block; }
    .opt input { vertical-align: middle; }

    .count { font-size: 13px; color: var(--sub); margin: 0 2px 4px; }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px 16px; margin: 10px 0;
    }
    .card.done { opacity: .55; }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 700; color: #fff;
      padding: 3px 9px; border-radius: 999px; margin-bottom: 8px;
    }
    .badge.keep { background: var(--keep); }
    .badge.done { background: #9ca3af; }
    .item { font-size: 16px; font-weight: 700; line-height: 1.5; white-space: pre-wrap; }
    .meta { font-size: 13px; color: var(--sub); margin: 3px 0; }
    .storage {
      margin-top: 10px; padding: 9px 11px; border-radius: 8px;
      background: #ecfdf5; color: #065f46; font-size: 14px; font-weight: 600;
    }

    .msg { text-align: center; color: var(--sub); padding: 30px 0; font-size: 14px; }
    .demo {
      background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
      border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 12px 0;
    }
    footer { text-align: center; font-size: 12px; color: var(--sub); margin-top: 30px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🔎 남원여고 분실물 센터</h1>
      <p>내 물건이 있는지 찾아보고, 물건을 주웠다면 등록해 주세요.</p>
    </header>

    <a class="btn" id="btnForm" target="_blank" rel="noopener">😊 물건을 주웠어요 (등록하기)</a>
    <p class="hint">물건을 잃어버렸다면 아래 목록에서 찾아보세요. 내 물건이 있으면 <b>보관 장소</b>로 가면 돼요.</p>

    <div id="demoNote" class="demo" style="display:none">
      지금은 <b>미리보기(샘플 데이터)</b> 모드입니다. 아래 <code>설정</code> 부분의 <code>CSV_URL</code>에 시트 링크를 넣으면 실제 데이터가 표시됩니다.
    </div>

    <div class="tools">
      <input type="search" id="q" placeholder="물건, 장소로 검색 (예: 에어팟, 체육관)">
    </div>
    <label class="opt"><input type="checkbox" id="hideDone"> 주인 찾은 물건은 숨기기</label>
    <div class="count" id="count"></div>

    <div id="list"><div class="msg">불러오는 중...</div></div>

    <footer>남원여고 드림 스타트업 프로젝트 · 등록한 내용은 몇 분 뒤 목록에 반영됩니다</footer>
  </div>

  <script>
    /* ===================== 설정 (여기만 바꾸세요) ===================== */
    // 1) 구글 폼 링크 (연결 완료)
    const FORM_URL = "https://forms.gle/AXCREFAJywUDhd859";
    // 2) 시트 "파일 → 공유 → 웹에 게시" (CSV 형식) 로 복사한 주소
    //    ※ 반드시 '공개용' 탭(주운 사람 정보가 빠진 탭)을 게시하세요.
    const CSV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRQL7AOccg-1JtX0uUqWTsCdhwl3GW5aXu-dYB_Dh7hLEZDFkTRQbbPScsjhaD66ugmHSIC-KSU4XnT/pub?gid=853036196&single=true&output=csv";

    // 시트의 열 제목에 아래 글자가 포함되어 있으면 해당 칸으로 인식합니다.
    const KEYWORDS = {
      item:    "주운 물건",   // 주운 물건 (구체적 묘사)
      place:   "주운 장소",   // 물건을 주운 장소
      time:    "주운 시간",   // 물건을 주운 시간
      storage: "보관",        // 보관 장소
      status:  "상태",        // 처리상태 (관리자가 직접 추가하는 열: 보관 중 / 주인 찾음)
    };
    /* ================================================================= */

    const isSet = (v) => v && !v.startsWith("여기에_");
    const $ = (id) => document.getElementById(id);

    $("btnForm").href = isSet(FORM_URL) ? FORM_URL : "#";

    // 보안: 사용자가 입력한 글이 코드로 실행되지 않도록 변환
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // 열 제목에서 키워드가 들어간 열을 찾아 값을 가져옴
    // 개인정보 보호: '주운 사람' 열은 시트에 있어도 절대 읽지 않음
    function pick(row, key) {
      const header = Object.keys(row)
        .filter(h => !h.includes("주운 사람"))
        .find(h => h.trim().includes(KEYWORDS[key]));
      return header ? (row[header] || "").trim() : "";
    }

    let items = [];

    function normalize(row) {
      const status = pick(row, "status");
      return {
        item: pick(row, "item"),
        place: pick(row, "place"),
        time: pick(row, "time"),
        storage: pick(row, "storage"),
        status,
        done: /찾음|완료|반환/.test(status),
      };
    }

    function render() {
      const q = $("q").value.trim().toLowerCase();
      const hideDone = $("hideDone").checked;

      const shown = items.filter(it => {
        if (hideDone && it.done) return false;
        if (q && !(it.item + " " + it.place + " " + it.storage).toLowerCase().includes(q)) return false;
        return true;
      });

      $("count").textContent = `총 ${shown.length}개`;

      if (!shown.length) {
        $("list").innerHTML = '<div class="msg">조건에 맞는 분실물이 없어요.</div>';
        return;
      }

      $("list").innerHTML = shown.map(it => `
        <div class="card ${it.done ? "done" : ""}">
          <span class="badge ${it.done ? "done" : "keep"}">${it.done ? "주인 찾음" : "보관 중"}</span>
          <div class="item">${esc(it.item || "(내용 없음)")}</div>
          ${it.place ? `<div class="meta">📍 주운 장소: ${esc(it.place)}</div>` : ""}
          ${it.time ? `<div class="meta">🕐 주운 시간: ${esc(it.time)}</div>` : ""}
          ${it.storage ? `<div class="storage">🗄️ 보관 장소: ${esc(it.storage)}</div>` : ""}
        </div>
      `).join("");
    }

    // 이벤트
    $("q").addEventListener("input", render);
    $("hideDone").addEventListener("change", render);

    // 샘플 데이터 (CSV 링크를 아직 안 넣었을 때 미리보기용)
    const SAMPLE = [
      { "주운 물건": "검정색 에어팟 케이스 (흰색 스티커가 붙어 있어요)", "물건을 주운 장소": "체육관 앞", "물건을 주운 시간": "10월 22일 점심시간", "보관 장소": "2학년 교무실", "처리상태": "보관 중" },
      { "주운 물건": "파란색 우산", "물건을 주운 장소": "1층 현관", "물건을 주운 시간": "10월 21일 하교 후", "보관 장소": "1학년 교무실", "처리상태": "보관 중" },
      { "주운 물건": "수학 문제집 (표지에 '민' 글자)", "물건을 주운 장소": "도서관", "물건을 주운 시간": "10월 19일 방과 후", "보관 장소": "2학년 교무실", "처리상태": "주인 찾음" },
    ];

    // 데이터를 못 불러왔을 때: 이유를 알려주고, 시트 '간단 보기'를 대신 보여줌
    // (파일을 더블클릭해서 열면 구글이 데이터 요청을 막기 때문에 이 경우가 생김)
    function showFallback() {
      const onFile = location.protocol === "file:";
      const embed = CSV_URL.replace("/pub?", "/pubhtml?").replace("&output=csv", "&widget=true&headers=false");
      const why = onFile
        ? "이 파일을 <b>더블클릭해서 직접 열면</b> 구글이 데이터를 막아서 카드 목록을 만들 수 없어요. 인터넷에 올린 주소(Netlify, GitHub Pages 등)로 열면 정상적으로 보여요. 아래는 임시로 보여주는 간단 보기예요."
        : "데이터를 불러오지 못했어요. 인터넷 연결이나 시트의 '웹에 게시' 설정을 확인해 주세요. 아래는 임시로 보여주는 간단 보기예요.";
      $("count").textContent = "";
      $("list").innerHTML =
        '<div class="demo">' + why + '</div>' +
        '<iframe src="' + esc(embed) + '" style="width:100%;height:420px;border:1px solid var(--line);border-radius:10px;background:#fff"></iframe>' +
        '<p class="hint"><a href="#" onclick="location.reload();return false">다시 시도</a></p>';
    }

    function load() {
      if (!isSet(CSV_URL)) {
        $("demoNote").style.display = "block";
        items = SAMPLE.map(normalize);
        render();
        return;
      }

      // 주소 뒤에 시간값을 붙여 캐시된 옛날 데이터가 나오지 않게 함
      const url = CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now();

      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (res) => {
          items = res.data
            .map(normalize)
            .filter(it => it.item || it.place)   // 빈 줄 제외
            .reverse();                          // 최신 글이 위로
          render();
        },
        error: showFallback,
      });
    }

    load();
  </script>
</body>
</html>
